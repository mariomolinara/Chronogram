# Chronogram behind the EXISTING nginx of devaidalab.unicas.it.
#
# The machine's nginx already terminates TLS on 443 with a valid certificate;
# these snippets only add the /chronogram application, proxied to the local
# Tomcat on port 8800 (WAR context path /chronogram → the URI is forwarded
# untouched, so no rewrite is needed).
#
# 1) The `limit_req_zone` directives must live in the http {} context: put this
#    file in /etc/nginx/conf.d/chronogram-zones.conf (loaded inside http {}),
#    or copy the two lines into an existing http-level file.
# 2) The `location` blocks go INSIDE the existing `server { listen 443 ssl; }`
#    block for devaidalab.unicas.it.

# --------------- http {} context ---------------
limit_req_zone $binary_remote_addr zone=chrono_llm:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=chrono_auth:10m rate=10r/s;

# --------------- inside server { listen 443 ssl; server_name devaidalab.unicas.it; } ---------------

