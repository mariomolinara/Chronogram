# Reverse proxy in front of the Spring Boot backend (embedded Tomcat, port 8080).
#
# The backend serves its API under the context path /chronogram, so clients hit
# e.g. https://your-domain.example/chronogram/api/... — nginx forwards the URI
# untouched (location / + proxy_pass without a trailing path).
#
# TLS certificates are expected at /etc/nginx/certs/{fullchain,privkey}.pem
# (mounted from ./nginx/certs — see docker-compose.yml). Obtain them e.g. with
# Let's Encrypt / certbot; NEVER commit the private key.

# --- Rate limiting (http context) ---------------------------------------------
# This file is included from the stock nginx.conf via `include
# /etc/nginx/conf.d/*.conf;`, which sits INSIDE the `http {}` block — so these
# `limit_req_zone` directives are in the correct (http) context. They MUST stay
# out of any `server {}`/`location {}` block.
#
# Key is $binary_remote_addr (compact per-client-IP bucket). nginx sees the real
# client only via X-Forwarded-For here if it were itself behind another proxy;
# in this stack nginx is the edge, so $binary_remote_addr is the actual client.
#
#  - llm zone : the LLM endpoint proxies to a paid/limited upstream (OpenRouter),
#               so it is the most abuse/cost sensitive. 5 req/s per IP.
#  - auth zone: login/register/reset — throttled to blunt brute-force and
#               reset-email spam while staying comfortable for real users. 10 req/s per IP.
# 10m of shared memory tracks ~160k distinct IPs per zone.
limit_req_zone $binary_remote_addr zone=chrono_llm:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=chrono_auth:10m rate=10r/s;

# Return 429 (Too Many Requests) instead of the nginx default 503 when a client
# exceeds its burst — clearer semantics for API clients and monitoring.
limit_req_status 429;

# --- Shared proxy settings ----------------------------------------------------
# Reusable snippet so the HTTP (dev fallback) and HTTPS blocks stay in sync.
# X-Forwarded-Proto is honoured by Spring (server.forward-headers-strategy) so
# the app builds correct absolute URLs (e.g. password-reset links) behind TLS.

# --- HTTP ---------------------------------------------------------------------
# In production this only exists to redirect to HTTPS (and to answer the ACME
# http-01 challenge, if you renew certs with the webroot method).
server {
    listen 80;
    server_name _;   # replace with your domain in production

    # Let's Encrypt / certbot webroot challenge (renewal without downtime).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;   # replace with your domain in production

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern, safe TLS defaults.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers.
    # HSTS: force HTTPS for 6 months. Only enable includeSubDomains/preload once
    # you are sure every subdomain is HTTPS-only.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow reasonably large LLM prompt payloads.
    client_max_body_size 2m;

    # Common proxy settings shared by every location. Kept in a snippet so the
    # rate-limited locations below stay byte-for-byte in sync with `location /`.
    # (nginx does NOT inherit proxy_* directives from an outer location, so each
    # dedicated location must set them explicitly — this include does that.)
    # Note: remember the backend context path is /chronogram, so these locations
    # match the full proxied URI (e.g. /chronogram/api/llm/), NOT bare /api/... .

    # LLM endpoint — most expensive/abuse-prone (paid upstream). Tightest limit.
    # burst=10 absorbs short bursts; nodelay serves them immediately instead of
    # queueing, only rejecting (429) once the burst bucket is also exhausted.
    location /chronogram/api/llm/ {
        limit_req zone=chrono_llm burst=10 nodelay;

        proxy_pass http://chronogram-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Authentication endpoints — throttle brute-force / reset-email spam.
    # Slightly higher rate + burst than LLM: real login/registration flows can
    # fire a few requests in quick succession (retry after validation error).
    location /chronogram/api/auth/ {
        limit_req zone=chrono_auth burst=20 nodelay;

        proxy_pass http://chronogram-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass http://chronogram-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
