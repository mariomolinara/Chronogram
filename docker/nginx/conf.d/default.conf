# Reverse proxy in front of the Spring Boot backend (embedded Tomcat, port 8080).
#
# On a public machine, point your DNS A record at the host and enable the HTTPS
# server block below (obtain certificates e.g. with Let's Encrypt / certbot).

# --- HTTP ---------------------------------------------------------------------
server {
    listen 80;
    server_name _;   # replace with your domain in production

    # For a public deploy with TLS, redirect HTTP to HTTPS instead of proxying:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://chronogram-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

