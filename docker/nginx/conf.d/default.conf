# Reverse proxy in front of the Spring Boot backend (embedded Tomcat, port 8080).
#
# The backend serves its API under the context path /chronogram, so clients hit
# e.g. https://your-domain.example/chronogram/api/... — nginx forwards the URI
# untouched (location / + proxy_pass without a trailing path).
#
# TLS certificates are expected at /etc/nginx/certs/{fullchain,privkey}.pem
# (mounted from ./nginx/certs — see docker-compose.yml). Obtain them e.g. with
# Let's Encrypt / certbot; NEVER commit the private key.

# --- Shared proxy settings ----------------------------------------------------
# Reusable snippet so the HTTP (dev fallback) and HTTPS blocks stay in sync.
# X-Forwarded-Proto is honoured by Spring (server.forward-headers-strategy) so
# the app builds correct absolute URLs (e.g. password-reset links) behind TLS.

# --- HTTP ---------------------------------------------------------------------
# In production this only exists to redirect to HTTPS (and to answer the ACME
# http-01 challenge, if you renew certs with the webroot method).
server {
    listen 80;
    server_name _;   # replace with your domain in production

    # Let's Encrypt / certbot webroot challenge (renewal without downtime).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;   # replace with your domain in production

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern, safe TLS defaults.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers.
    # HSTS: force HTTPS for 6 months. Only enable includeSubDomains/preload once
    # you are sure every subdomain is HTTPS-only.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow reasonably large LLM prompt payloads.
    client_max_body_size 2m;

    location / {
        proxy_pass http://chronogram-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
