services:
  mysql:
    container_name: chronogram-mysql
    image: mysql:8.0
    restart: always
    # Variables are injected straight from the root .env file, so the stack works
    # even when `docker compose up` is run WITHOUT `--env-file .env`.
    env_file:
      - ../.env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ escapes to a literal $, so the shell inside the container expands the
      # password from its own environment (loaded via env_file above).
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    container_name: chronogram-backend
    build:
      context: ../backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # All app config (JWT_SECRET_KEY, LLM_*, MAIL_*, CORS_*, MYSQL_*, ...) comes
    # directly from the root .env via env_file — no dependency on `--env-file`.
    env_file:
      - ../.env
    environment:
      # Only the DB host/port on the Docker network need overriding here; the app
      # falls back to MYSQL_DATABASE/MYSQL_USER/MYSQL_PASSWORD for the rest.
      DB_HOST: chronogram-mysql
      DB_PORT: "3306"
    volumes:
      - ./logs:/app/logs

  nginx:
    image: nginx:latest
    container_name: chronogram-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # For HTTPS on a public machine, place fullchain.pem/privkey.pem here and
      # enable the 443 server block in nginx/conf.d/default.conf:
      # - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  mysql-data:
