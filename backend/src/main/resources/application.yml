spring:
  application:
    name: chronogram

  datasource:
    # DB_* take precedence; otherwise fall back to the MYSQL_* names that come
    # from the shared .env (via docker-compose env_file), then to local defaults.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:${MYSQL_DATABASE:chronogram}}?serverTimezone=Europe/Rome&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true
    username: ${DB_USER:${MYSQL_USER:chronouser}}
    password: ${DB_PASS:${MYSQL_PASSWORD:chronopass}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      pool-name: chronogram-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Rome

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  servlet:
    context-path: /chronogram
  error:
    include-message: never
    include-stacktrace: never

# --- Application-specific configuration ---
chronogram:
  security:
    jwt:
      # HMAC secret; MUST be provided in production and be at least 32 bytes long.
      secret: ${JWT_SECRET_KEY:}
      # Access-token lifetime in milliseconds (default 24h).
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
      issuer: chronogram
    cors:
      # Comma-separated allowlist of front-end origins. NEVER use "*" with credentials.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8100,http://localhost:5173}
  reset:
    # Canonical base URL of the front-end: ALWAYS used to build password-reset
    # links (the request Origin header is ignored, see ChronogramProperties.Reset).
    # Default targets the Vite dev server. A trailing slash is tolerated.
    app-base-url: ${APP_CANONICAL_URL:http://localhost:5173}
    token-ttl-minutes: 30
    # Minimum seconds between two accepted reset requests for the same account.
    # A second request within this window is silently ignored (no new email/token),
    # throttling reset-email spam without revealing whether the account exists.
    request-cooldown-seconds: ${RESET_REQUEST_COOLDOWN_SECONDS:60}
  llm:
    api-url: ${LLM_API_URL:https://openrouter.ai/api/v1/chat/completions}
    api-key: ${LLM_API_KEY:}
    default-model: ${LLM_DEFAULT_MODEL:deepseek/deepseek-chat-v3-0324:free}
  admin:
    # Built-in administrator, created on first boot. Leave ADMIN_EMAIL empty to
    # skip provisioning entirely. ADMIN_INITIAL_PASSWORD is only used at creation
    # time: the account starts flagged "must change password" and the value stops
    # working once a new password is set from the admin page.
    email: ${ADMIN_EMAIL:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  registration:
    # Registrations from these email domains are approved automatically (sub-domains
    # included, so unicas.it also covers studenti.unicas.it). Everyone else is
    # created PENDING and needs an administrator to approve them. Comma-separated;
    # leave empty to send every registration through manual approval.
    auto-approve-domains: ${REGISTRATION_AUTO_APPROVE_DOMAINS:unicas.it}
    # Email the administrator when a registration is waiting for a decision.
    notify-admin: ${REGISTRATION_NOTIFY_ADMIN:true}
  stats:
    # Windows behind the dashboard metrics (see AdminService).
    active-window-days: ${STATS_ACTIVE_WINDOW_DAYS:10}
    regular-window-days: ${STATS_REGULAR_WINDOW_DAYS:7}
    distribution-days: ${STATS_DISTRIBUTION_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # The SMTP server is only needed for password-reset emails; don't let its
      # availability drive the overall health status.
      enabled: false

logging:
  level:
    it.unicas.chronogram: ${LOG_LEVEL:INFO}
